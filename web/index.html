<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>流萤音乐 · 为你而选的好音乐</title>
<meta name="description" content="流萤音乐：个性化推荐、流式播放不等待、逐字歌词跟着唱。">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0b0d;--fg:#f5f5f5;--sub:#8e8e93;--line:#262629;--blue:#2a6df4}
html,body{background:var(--bg);color:var(--fg);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 22px;min-height:100vh;display:flex;flex-direction:column}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:70px 0 40px;text-align:center}
.logo{font-size:56px;line-height:1}
h1{font-size:34px;font-weight:800;margin-top:22px;letter-spacing:1px}
.slogan{font-size:16px;color:var(--sub);margin-top:16px;line-height:1.7}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:40px 0 8px}
.feat{background:#17171a;border:1px solid var(--line);border-radius:14px;padding:18px 10px}
.feat .ico{font-size:24px}.feat .t{font-size:13px;margin-top:10px;font-weight:600}
.feat .d{font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.5}
.dl{margin-top:38px;display:flex;flex-direction:column;gap:12px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:600;
text-decoration:none;text-align:center}
.btn.ios{background:var(--fg);color:#0b0b0d}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.soon{font-size:12px;color:var(--sub);margin-top:10px}
footer{padding:26px 0 calc(28px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:#5a5a60}
footer a{color:var(--sub);text-decoration:none;margin:0 8px}
/* 官网轮播图（后台「网站管理」动态管理，数量不固定；无图时整块隐藏） */
.banners{display:none;position:relative;width:100%;margin:34px 0 6px;border-radius:16px;overflow:hidden;background:#141417;border:1px solid var(--line)}
.banners.on{display:block}
.b-track{display:flex;transition:transform .5s ease}
.b-track img{width:100%;flex-shrink:0;display:block;aspect-ratio:16/7;object-fit:cover}
.b-caption{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72));color:#fff;font-size:14px;font-weight:600;text-align:left;pointer-events:none}
.b-dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.b-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.38);cursor:pointer;transition:background .3s}
.b-dots i.on{background:#fff}
@media(max-width:420px){h1{font-size:28px}.feats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="logo">&#9835;</div>
    <h1>流萤音乐</h1>
    <p class="slogan">为你精心挑选的音乐<br>流式播放不等待，逐字歌词跟着唱</p>

    <div class="banners" id="banners">
      <div class="b-track" id="bTrack"></div>
      <div class="b-caption" id="bCap"></div>
      <div class="b-dots" id="bDots"></div>
    </div>

    <div class="feats">
      <div class="feat"><div class="ico">&#127925;</div><div class="t">个性推荐</div><div class="d">懂你的口味，每次打开都有新惊喜</div></div>
      <div class="feat"><div class="ico">&#9889;</div><div class="t">秒开播放</div><div class="d">音频流式加载，预缓存切歌不等待</div></div>
      <div class="feat"><div class="ico">&#128214;</div><div class="t">逐字歌词</div><div class="d">跟随节拍高亮，沉浸式跟唱</div></div>
    </div>

    <div class="dl">
      <!-- 下载地址可在后台「站点配置」维护；此处为静态占位，部署后可替换 -->
      <a class="btn ios" href="#" onclick="return false">下载 iOS 版</a>
      <a class="btn ghost" href="/music/admin.html">管理后台</a>
    </div>
    <p class="soon">Android 版本即将上线</p>
  </section>
  <footer>
    <div>© 流萤音乐 Liuying Music</div>
    <div style="margin-top:8px">
      <a href="/music/collect.html">音源采集</a>·<a href="/api/health">服务状态</a>
    </div>
  </footer>
</div>
<script>
// 官网轮播图：从后端动态读取，数量由后台「网站管理」控制（不限张数），无图时自动隐藏
(function(){
  var box=document.getElementById('banners'),track=document.getElementById('bTrack'),
      cap=document.getElementById('bCap'),dots=document.getElementById('bDots');
  var idx=0,timer=null;
  function go(n){
    if(!track.children.length)return;
    idx=(n+track.children.length)%track.children.length;
    track.style.transform='translateX(-'+(idx*100)+'%)';
    var b=window.__banners[idx];
    cap.textContent=b&&b.title?b.title:'';
    cap.style.display=b&&b.title?'block':'none';
    var ds=dots.children;
    for(var i=0;i<ds.length;i++)ds[i].className=i===idx?'on':'';
  }
  function start(){
    if(timer)clearInterval(timer);
    timer=setInterval(function(){go(idx+1)},4000);
  }
  fetch('/music/api/site-config').then(function(r){return r.json()}).then(function(c){
    var bs=(c&&c.banners)||[];
    window.__banners=bs;
    if(!bs.length){box.className='banners';return;}
    box.className='banners on';
    track.innerHTML='';
    dots.innerHTML='';
    bs.forEach(function(b,i){
      var im=document.createElement('img');
      im.src='/music/api/banner/'+encodeURIComponent(b.name);
      im.alt=b.title||'';
      im.loading='lazy';
      if(b.link){
        var a=document.createElement('a');
        a.href=b.link;a.target='_blank';a.rel='noopener';
        a.appendChild(im);track.appendChild(a);
      }else track.appendChild(im);
      var d=document.createElement('i');
      d.onclick=function(){go(i);start();};
      dots.appendChild(d);
    });
    go(0);
    start();
    var sx=0;
    box.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
    box.addEventListener('touchend',function(e){
      var dx=e.changedTouches[0].clientX-sx;
      if(Math.abs(dx)>40){go(idx+(dx<0?1:-1));start();}
    },{passive:true});
  }).catch(function(){box.className='banners';});
})();
</script>
</body>
</html>
